# Georgian baseline (pretrained, no training by us): NVIDIA FastConformer hybrid Transducer-CTC (~115M), decoded
# with its default transducer head (as on the model card). Trained by NVIDIA on CV 17.0 train/dev/other + FLEURS
# train/dev (see docs/data-notes-cv-ka.md for the contamination caveat). Dev run.
name: nvidia-stt-ka-fastconformer_cv-ka_dev
dataset: data/cv/ka/manifest.jsonl   # Common Voice Scripted Speech 27.0 ka, official split
split: dev
languages: [ka]
eligibility_confirmed: true   # confirmed by the student (never record why)
batch_size: 16
model:
  family: nemo
  id: nvidia/stt_ka_fastconformer_hybrid_large_pc
  revision: bdfd7871e0574001e650e741d6201d40205db6bb  # pinned 2026-11-19 (same SHA as the 2026-11-17 FLEURS ka dev runs)
  device: cuda
  dtype: float32
