# Georgian baseline (pretrained, no training by us). Dev run: select settings here, test runs once later.
name: whisper-small_fleurs-ka_dev
dataset: data/fleurs/ka_ge/manifest.jsonl
split: dev
languages: [ka]
eligibility_confirmed: true   # confirmed by the student 2026-11-17 (never record why)
batch_size: 32   # 32 for throughput (Georgian is token-expensive for Whisper); same in dev and test
model:
  family: hf-whisper
  id: openai/whisper-small
  revision: 973afd24965f72e36ca33b3055d56a652f456b4d  # pinned 2026-11-19 (same SHA as the 2026-11-17 FLEURS ka dev runs)
  device: cuda
  dtype: float16
  beam_size: 1
  language_hints: {ka: georgian}
