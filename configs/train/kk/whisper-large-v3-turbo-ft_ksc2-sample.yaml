# Our contribution #2 (A1): full fine-tune of Whisper-large-v3-turbo (809M) on the same stratified 3 % KSC2 train
# sample (~34 h) as Whisper-small, so model size is the only change. Checkpoint selected on the same 300 random KSC2
# dev items; test never read. Trained on a Colab A100 (bf16).
name: whisper-large-v3-turbo-ft_ksc2-sample
dataset: data/ksc2/manifest.jsonl
language: kk
eligibility_confirmed: true      # confirmed by the student 2026-11-17 (never record why)
train_filter: {in_train_sample: true}
dev_limit: 300
max_audio_sec: 30
seed: 42
model:
  family: hf-whisper
  id: openai/whisper-large-v3-turbo
  revision: main
  language_hint: kazakh
training:
  learning_rate: 1.0e-5
  warmup_steps: 500
  max_steps: 4000
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  eval_steps: 500
  save_steps: 500
  dataloader_num_workers: 8
