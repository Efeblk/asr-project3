# Our contribution #3 (A1): MMS adapter fine-tune. Start from facebook/mms-1b-all with its Kazakh ('kaz') adapter,
# freeze the 1B base, train only the adapter layers + CTC head (~2 M params) on the same 3 % KSC2 sample as the
# Whisper fine-tunes. Recipe: HF blog "Fine-tuning MMS Adapter Models for Multi-Lingual ASR" (lr 1e-3, batch 32).
name: mms-1b-all-kaz-adapter-ft_ksc2-sample
dataset: data/ksc2/manifest.jsonl
language: kk
eligibility_confirmed: true      # confirmed by the student 2026-11-17 (never record why)
train_filter: {in_train_sample: true}
dev_limit: 300
max_audio_sec: 30
seed: 42
model:
  family: hf-ctc
  id: facebook/mms-1b-all
  revision: main
  target_lang: kaz
  reuse_vocab: true
  adapter_only: true
  model_kwargs: {layerdrop: 0.0}
training:
  learning_rate: 1.0e-3
  warmup_steps: 100
  max_steps: 3000                # ~5 epochs of the 34 h sample at batch 32
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 8
  eval_steps: 500
  save_steps: 500
  dataloader_num_workers: 8
