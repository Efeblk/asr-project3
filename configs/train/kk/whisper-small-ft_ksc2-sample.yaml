# Our contribution #1 (A1): full fine-tune of Whisper-small on the stratified 3 % KSC2 train sample (~34 h,
# all six domains + TTS, Russian removed). Checkpoint selected on 300 random KSC2 dev items; test never read.
name: whisper-small-ft_ksc2-sample
dataset: data/ksc2/manifest.jsonl
language: kk
eligibility_confirmed: true      # confirmed by the student 2026-11-17 (never record why)
train_filter: {in_train_sample: true}
dev_limit: 300
max_audio_sec: 30
seed: 42
model:
  family: hf-whisper
  id: openai/whisper-small
  revision: main
  language_hint: kazakh
training:
  learning_rate: 1.0e-5
  warmup_steps: 500
  max_steps: 4000
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  eval_steps: 500
  save_steps: 500
  dataloader_num_workers: 4
