# Our contribution (A1), Georgian: MMS adapter fine-tune. facebook/mms-1b-all with its Georgian ('kat') adapter;
# the 1B base is frozen, only the adapter layers + CTC head (~2 M params) are trained on the CV 27.0 ka train split.
# Recipe: HF blog "Fine-tuning MMS Adapter Models for Multi-Lingual ASR" (lr 1e-3, batch 32).
name: mms-1b-all-kat-adapter-ft_cv-ka
dataset: data/cv/ka/manifest.jsonl
language: ka
eligibility_confirmed: true      # confirmed by the student (never record why)
dev_limit: 300
max_audio_sec: 30
seed: 42
model:
  family: hf-ctc
  id: facebook/mms-1b-all
  revision: main
  target_lang: kat
  reuse_vocab: true
  adapter_only: true
  model_kwargs: {layerdrop: 0.0}
training:
  learning_rate: 1.0e-3
  warmup_steps: 100
  max_steps: 3000                # ~1 epoch of CV ka train at batch 32
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 8
  eval_steps: 500
  save_steps: 500
  dataloader_num_workers: 8
