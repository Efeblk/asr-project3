# Fine-tune Whisper-small on our language's train split (our contribution, announcement A1).
# Selects the checkpoint on dev; never reads test. Afterwards, `asrbench run` the saved model like any
# baseline (model.id = checkpoints/<name>_<ts>/final) on dev, then once on the frozen test set.
# Smoke-tested on an RTX 4070 SUPER 12 GB: ~1.3 s/step at batch 16 (4000 steps ~ 1.5 h).
name: whisper-small-ft_fleurs-xx
dataset: data/fleurs/xx/manifest.jsonl     # needs train + dev splits (import with --splits train dev test)
language: xx
eligibility_confirmed: false               # set true once confirmed (never record whose mother tongue)
dev_limit: 200                             # dev items scored at each eval (generation is slow); final dev run uses all
train_hours: null                          # e.g. 1, 2, 5 for a learning curve; null = all train data
max_audio_sec: 30
seed: 42
model:
  family: hf-whisper
  id: openai/whisper-small                 # multilingual only; never .en
  revision: main                           # resolved to a commit hash in train_manifest.json
  language_hint: <whisper language name>   # e.g. swahili
training:                                  # passed to Seq2SeqTrainingArguments (defaults in src/asrbench/train.py)
  learning_rate: 1.0e-5
  warmup_steps: 500
  max_steps: 4000
  per_device_train_batch_size: 16
  eval_steps: 500
  save_steps: 500
