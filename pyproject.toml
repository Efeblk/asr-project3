[project]
name = "asrbench"
version = "0.1.0"
description = "Reproducible multilingual (non-English) ASR evaluation harness for the course project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jiwer==4.0.0",
    "numpy==1.26.4",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "pyyaml==6.0.3",
    "huggingface-hub[hf_xet]==0.36.2",
    "regex==2026.11.15",
]

[project.optional-dependencies]
# Transformers-based models: Whisper (multilingual) and wav2vec2/XLS-R/MMS CTC fine-tunes.
hf = [
    "torch==2.14.1",
    "transformers==4.57.6",
    "accelerate==1.12.0",
]
# Word n-gram LM beam search for CTC models (pyctcdecode + KenLM). KenLM builds on Linux/WSL only.
lm = [
    "pyctcdecode==0.5.0",
    "kenlm==0.3.0; sys_platform == 'linux'",
]
# NVIDIA NeMo models (FastConformer ka). NeMo is best supported on Linux/WSL in its own venv.
nemo = [
    "torch==2.14.1",
    "nemo_toolkit[asr]==3.0.0",
]

[project.scripts]
asrbench = "asrbench.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asrbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads models or datasets (deselect with -m 'not slow')"]

# CUDA builds of torch on Windows/Linux; macOS falls back to the default PyPI (CPU/MPS) wheels.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]


[tool.uv]
# Keep the same torch release on every platform (the CUDA index lags PyPI).
constraint-dependencies = ["torch==2.14.1"]
