name: mms-1b-all-kaz-adapter-ft_ksc2-sample
dataset: data/ksc2/manifest.jsonl
language: kk
eligibility_confirmed: true
train_filter:
  in_train_sample: true
dev_limit: 300
max_audio_sec: 30
seed: 42
model:
  family: hf-ctc
  id: facebook/mms-1b-all
  revision: main
  target_lang: kaz
  reuse_vocab: true
  adapter_only: true
  model_kwargs:
    layerdrop: 0.0
training:
  learning_rate: 0.001
  warmup_steps: 100
  max_steps: 3000
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 8
  eval_steps: 500
  save_steps: 500
  dataloader_num_workers: 8
